name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "script/deploy-frontend.sh"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  HTML_DIR: '/var/www/html/'
  STAGING_DIR: '/tmp/haben-frontend-deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN || 'https://api.nenene.n-e.kr' }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'https://www.nenene.n-e.kr' }}
      VITE_KAKAO_JAVASCRIPT_KEY: ${{ vars.VITE_KAKAO_JAVASCRIPT_KEY }}
      VITE_KAKAO_REDIRECT_URI: ${{ vars.VITE_KAKAO_REDIRECT_URI || format('{0}/auth/kakao/callback', vars.FRONTEND_ORIGIN || 'https://www.nenene.n-e.kr') }}
      VITE_PORTONE_STORE_ID: ${{ vars.VITE_PORTONE_STORE_ID }}
      VITE_PORTONE_CHANNEL_KEY: ${{ vars.VITE_PORTONE_CHANNEL_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload built files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_FRONTEND_HOST }}
          port: ${{ secrets.DEPLOY_FRONTEND_PORT }}
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          source: "frontend/dist/**,script/deploy-frontend.sh"
          target: ${{ env.STAGING_DIR }}

      - name: Publish to Nginx html folder
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_FRONTEND_HOST }}
          port: ${{ secrets.DEPLOY_FRONTEND_PORT }}
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          command_timeout: 10m
          script: |
            bash "${{ env.STAGING_DIR }}/script/deploy-frontend.sh" "${{ env.STAGING_DIR }}" "${{ env.HTML_DIR }}"
