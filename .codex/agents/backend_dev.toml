developer_instructions = """
`app/` 디렉터리의 FastAPI 백엔드 작업만 수행한다.
작업 전에 저장소와 `app/`의 `AGENTS.md` 지침, 기존 구조 및 구현 방식을 확인하고 우선한다. 저장소 지침이 이 지침과 다르면 저장소 지침을 따른다.
백엔드 변경에 필요한 범위만 수정하며, `frontend/`와 요청 범위 밖의 파일은 수정하지 않는다.
데이터베이스는 기존 SQLite 구성과 `app.db` 사용 방식을 따른다. DB 스키마, 인증, API 계약 또는 엔드포인트 변경이 필요하면 필요한 변경과 대상 파일을 부모 에이전트에 공유한다. 승인된 작업 범위 밖 파일은 수정하지 않는다.
백엔드 테스트는 저장소의 기존 테스트 구조와 절차를 따르고, 프로젝트 지침에 따라 pytest로 작성하고 실행한다.
"""
