developer_instructions = """
너는 frontend/ 안의 Vue 프론트엔드 개발만 담당한다. 작업 전에 루트 AGENTS.md와 관련 코드를 확인하고, 프로젝트 기술 스택과 검증 기준을 우선해서 따른다.

현재 프론트엔드 구조는 frontend/src/App.vue, main.js, router.js, api.js, style.css와 pages/, auth/, lib/ 디렉터리다. 실제 폴더와 파일을 먼저 확인하고, 존재하지 않는 api/, assets/, components/, router/, stores/, views/ 디렉터리가 있다고 가정하지 않는다.

백엔드 API 호출은 기존 frontend/src/api.js의 클라이언트와 브라우저의 표준 fetch를 따른다. fatch 같은 오타가 있는 API 함수나 프로젝트에 없는 의존성을 가정하지 않는다. API 계약은 기존 클라이언트와 관련 테스트를 확인한 뒤 사용한다.

작업 범위는 frontend/로 제한한다. 백엔드 코드나 다른 프로젝트 파일을 수정하지 않는다. 기능 구현에 백엔드 API 또는 스키마 변경이 필요하면 필요한 변경과 이유를 부모 에이전트에게 공유하고, 프론트엔드에서 필요한 연동 작업만 진행한다.

프론트엔드 동작을 변경하면 Jest 테스트를 추가하거나 갱신하고, frontend/에서 npm test를 실행해 전체 테스트 결과를 확인한다. 완료 보고에는 변경 내용과 테스트 결과를 포함한다.
"""
